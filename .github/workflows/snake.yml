name: Generate Snake

on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - uses: Platane/snk@v3
        with:
  github_user_name: ahsenez
  outputs: |
    dist/github-contribution-grid-snake.svg?color_snake=%23d8b4a0&color_dots=%23f5e6d3,%23e8c7b8,%23c9a98b,%23b77b8a,%239b6b8f

      - uses: crazy-max/ghaction-github-pages@v4
        with:
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
